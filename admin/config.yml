# Decap CMS configuration: edits houses.json visually.
# Requires Netlify Identity + Git Gateway enabled on the site.

backend:
  name: git-gateway
  branch: main            # change if your repo's default branch is different

media_folder: "images/uploads"     # where uploaded photos are saved in the repo
public_folder: "/images/uploads"   # how those photos are referenced on the site

collections:
  - name: "listings"
    label: "Listings"
    files:
      - name: "houses"
        label: "Properties (houses.json)"
        file: "houses.json"
        fields:
          - label: "Properties"
            name: "houses"
            widget: "list"
            label_singular: "Property"
            summary: "{{fields.address}} · {{fields.zone}}"
            fields:
              - { label: "ID", name: "id", widget: "string", hint: "Unique, no spaces. e.g. oh-007" }
              - { label: "Address", name: "address", widget: "string" }
              - { label: "Area / Neighbourhood", name: "zone", widget: "string", hint: "e.g. Dunbar, Fairview, West End" }
              - label: "Property Type"
                name: "type"
                widget: "select"
                options: ["Home", "Condo", "Townhouse"]
              - { label: "Price (CAD)", name: "price", widget: "number", value_type: "int", min: 0, step: 1000 }
              - { label: "Bedrooms", name: "beds", widget: "number", value_type: "int", min: 0 }
              - { label: "Bathrooms", name: "baths", widget: "number", value_type: "int", min: 0 }
              - { label: "Show in Featured Properties", name: "featured", widget: "boolean", default: false }
              - label: "Open House Date"
                name: "date"
                widget: "datetime"
                date_format: "YYYY-MM-DD"
                time_format: false
                format: "YYYY-MM-DD"
                required: false
                hint: "Leave empty if there is no open house. Past dates are hidden automatically."
              - { label: "Open House Time", name: "time", widget: "string", required: false, hint: "e.g. 2:00 PM – 4:00 PM" }
              - { label: "Cover Image", name: "image", widget: "image" }
              - { label: "Description", name: "description", widget: "text", hint: "Leave a blank line between paragraphs." }
              - label: "Gallery"
                name: "gallery"
                widget: "list"
                required: false
                hint: "Extra photos shown in the property gallery."
                field: { label: "Photo", name: "photo", widget: "image" }
              - { label: "Video / Virtual Tour URL", name: "video", widget: "string", required: false, hint: "YouTube, Vimeo or Matterport link. Optional." }
